[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/kampka/ka"

[workspace.dependencies]
ka-protocol = { path = "crates/ka-protocol", version = "0.2.2" }
ka-strand = { path = "crates/ka-strand", version = "0.2.2" }
ka-dialect = { path = "crates/ka-dialect", version = "0.2.2" }
ka-engine = { path = "crates/ka-engine", version = "0.2.2" }
ka-term = { path = "crates/ka-term", version = "0.2.2" }
ka-index = { path = "crates/ka-index", version = "0.2.2" }
ka-sandbox = { path = "crates/ka-sandbox", version = "0.2.2" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "sync", "time", "process", "io-util", "io-std"] }
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
parking_lot = "0.12"
ratatui = "0.29"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# unicode tables trimmed: \w/\s/\d/\b and case-folding stay Unicode-aware
# (unicode-perl + unicode-case); \p{...} categories/scripts are rejected by
# the regex compiler — the grep hand surfaces that as its instructive error
regex = { version = "1", default-features = false, features = [
    "std",
    "perf",
    "unicode-perl",
    "unicode-case",
] }
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
unicode-width = "0.2"
tokio-stream = "0.1"
schemars = "1"
keyring = { version = "3", default-features = false, features = ["apple-native", "windows-native", "linux-native"] }
ed25519-dalek = { version = "2", default-features = false, features = ["fast"] }
sha2 = { version = "0.10", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
opt-level = "s"
lto = "fat"
strip = true
panic = "abort"
codegen-units = 1
