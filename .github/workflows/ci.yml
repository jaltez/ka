name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace

  musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build -p ka-cli --release --target x86_64-unknown-linux-musl
      - run: ls -l target/x86_64-unknown-linux-musl/release/ka

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools time
      - run: cargo build -p ka-cli --release --target x86_64-unknown-linux-musl
      - run: cargo run -p xtask --quiet -- bench --bin target/x86_64-unknown-linux-musl/release/ka

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build (pubkey embedded for ka update verification)
        env:
          KA_PUBKEY: ${{ secrets.KA_PUBKEY }}
        run: cargo build -p ka-cli --release --target x86_64-unknown-linux-musl
      - name: Package
        run: |
          tar czf ka-x86_64-unknown-linux-musl.tar.gz -C target/x86_64-unknown-linux-musl/release ka
          sha256sum ka-x86_64-unknown-linux-musl.tar.gz > ka-x86_64-unknown-linux-musl.tar.gz.sha256
      - name: Sign
        env:
          KA_SIGNING_KEY: ${{ secrets.KA_SIGNING_KEY }}
        run: cargo run -p xtask --quiet -- sign ka-x86_64-unknown-linux-musl.tar.gz
      - name: Publish
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ka-x86_64-unknown-linux-musl.tar.gz
            ka-x86_64-unknown-linux-musl.tar.gz.sig
            ka-x86_64-unknown-linux-musl.tar.gz.sha256
