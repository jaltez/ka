[package]
name = "ka-cli"
description = "the ka binary: headless NDJSON surface"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "ka"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { workspace = true }
reqwest = { workspace = true }
ka-index = { workspace = true, optional = true }
ka-agent = { workspace = true }
ka-dialect = { workspace = true }
ka-strand = { workspace = true }
ka-term = { workspace = true }
ka-protocol = { workspace = true }
toml = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true

[features]
default = ["index"]
index = ["dep:ka-index"]
