[package]
name = "ka-engine"
description = "ka engine: turn machine over Command/Event queues + layered strict-TOML config"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[dependencies]
reqwest = { workspace = true }
ka-protocol = { workspace = true }
ka-dialect = { workspace = true }
ka-strand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true }
schemars = { workspace = true }
ignore = { workspace = true }
regex = { workspace = true }
ka-sandbox = { workspace = true }
parking_lot = { workspace = true }

[dev-dependencies]
parking_lot = { workspace = true }

[features]
# Exposes trust-store test redirection so integration contract suites
# can approve temp projects without touching the real trust file.
test-util = []

# The safe-mode contract needs trust::test_support (cfg-gated, so plain
# integration builds can't see it); CI and `cargo test --all-features`
# run it, featureless local runs skip it instead of failing to compile.
[[test]]
name = "bare_mode_contract"
required-features = ["test-util"]

[lints]
workspace = true
